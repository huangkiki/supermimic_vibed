name: Dynamics tensor tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install numpy==2.3.4
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check dynamics and replay without simulator dependencies
        run: >-
          python -m unittest
          tests.test_grounded_dynamics
          tests.test_retained_state_formal
          -v
